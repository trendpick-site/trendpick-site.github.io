name: Update Google Trends KR
on:
  workflow_dispatch:
  schedule:
    - cron: '13,43 * * * *'
permissions:
  contents: write
concurrency:
  group: google-trends-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch public RSS
        run: python scripts/fetch_google.py
      - name: Commit data only when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/google_kr.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update Google Trends KR data"
            git push
          fi
